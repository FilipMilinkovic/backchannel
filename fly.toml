# Fly.io: one machine with a volume. See README "Deploy to Fly.io".
#   fly launch --no-deploy --copy-config --name <your-app>   (then set PUBLIC_URL below to https://<your-app>.fly.dev)
#   fly volumes create backchannel_data --size 1
#   fly deploy
app = "backchannel-hub"
primary_region = "ams"
# Give in-flight requests time to drain on deploys (the hub needs at most SHUTDOWN_TIMEOUT_MS, 10 s by default).
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]

[env]
  PUBLIC_URL = "https://backchannel-hub.fly.dev"
  TRUST_PROXY = "fly"
  LOG_FORMAT = "json"

[[mounts]]
  source = "backchannel_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Agents keep a long poll open and browsers an event stream, so the machine is always busy anyway.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 4000

  [[http_service.checks]]
    method = "GET"
    path = "/readyz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

# SQLite and in-memory live connections: exactly one machine. Deploys replace it (brief reconnect for clients).
[deploy]
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
