name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t backchannel-hub:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name hub -p 8080:8080 backchannel-hub:ci
          for i in $(seq 30); do curl -fs localhost:8080/readyz && break; sleep 1; done
          curl -fs localhost:8080/readyz
          docker logs hub 2>&1 | grep -q 'Setup link'
          curl -fsI localhost:8080/install/backchannel.tgz
          docker stop hub
          test "$(docker inspect hub --format '{{.State.ExitCode}}')" = 0
